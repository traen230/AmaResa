<!doctype html>
<html>
  <body>
    <h1>ニュース検索</h1>
    <form method="POST">
      <input type="text" name="keyword" placeholder="検索ワードを入力" required>
      <button type="submit">検索</button>
    </form>

    {% if results %}
      <h2>検索結果:</h2>
      <ul>
        {% for title, url in results %}
          <li><a href="{{ url }}" target="_blank">{{ title }}</a></li>
        {% endfor %}
      </ul>
    {% endif %}
  </body>
</html>
