<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🔐 SHEINログイン待機中</title>
    <style>
        body {
            font-family: "メイリオ", "Segoe UI", sans-serif;
            background-color: #f9f9f9;
            padding: 30px;
            max-width: 800px;
            margin: auto;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            line-height: 1.8;
        }

        form {
            margin-top: 30px;
        }

        input[type="hidden"] {
            display: none;
        }

        input[type="submit"] {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #663399;
        }
    </style>
</head>
<body>
    <h1>🔐 SHEINログインを完了してください</h1>

    <p>拡張機能付きブラウザが起動しました。</p>
    <p>検索結果が表示されたら、検索実行ボタンをクリックしてください</p>

    <form action="{{ url_for('shein_research_execute') }}" method="POST">
        <input type="hidden" name="keyword" value="{{ keyword }}">
        <input type="submit" value="✅ 検索を実行">
    </form>

    <a href="{{ url_for('product_research') }}">← キーワード入力に戻る</a>
</body>
</html>
